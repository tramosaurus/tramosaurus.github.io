<figure class="figure">
  <img src="{{ include.src | relative_url }}" alt="{{ include.alt }}">
  {% if include.caption %}
    <figcaption class="figure-caption">{{ include.caption | markdownify }}</figcaption>
  {% endif %}
</figure>
